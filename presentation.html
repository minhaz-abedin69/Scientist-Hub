<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>শৈবাল: বিবর্তন, বৈচিত্র্য ও মহাকাশ গবেষণায় সম্ভাবনা</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div id="progress"><i></i></div>
<main id="stage" aria-live="polite"></main>
<nav id="controls" aria-label="Presentation controls">
  <div id="timeline" role="tablist"></div>
  <span id="counter">1 / 1</span>
</nav>
<button id="prev" aria-label="Previous slide">‹</button><button id="next" aria-label="Next slide">Next ›</button>
<div id="modal" hidden>
  <div class="mbox" role="dialog" aria-modal="true">
    <button class="mx" id="mclose" aria-label="Close">✕</button>
    <div id="mbody"></div>
  </div>
</div>
<script src="images.js"></script>
<script src="script.js"></script>

</html>
